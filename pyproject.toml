[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "muesli-stt-benchmark"
version = "0.1.0"
description = "Reproducible on-device ASR benchmarks across Apple Silicon runtimes"
requires-python = ">=3.11"
dependencies = [
  "jiwer>=3.0",
  "numpy>=1.26",
  "pyarrow>=15",
  "soundfile>=0.12",
]

[project.scripts]
stt-benchmark = "stt_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
